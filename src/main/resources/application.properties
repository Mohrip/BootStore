spring.application.name=CoreBackend


server.port=8085


## JPA and Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/corebackenddb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



##logging configuration
logging.level.org.springframework=INFO
logging.level.com.io.CoreBackend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


##Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings,loggers
management.endpoint.health.show-details=always

info.app.name=CoreBackend
info.app.description=Book CRUD learning project

## Security Configuration
## JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

