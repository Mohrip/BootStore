services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # REMOVED JAVA_TOOL_OPTIONS to let MaxRAMPercentage handle memory safely
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      postgres:
        condition: service_healthy

    # ---- 1. INSERT DEPLOY LIMITS HERE ----
    #
    # Without it: If your Spring Boot app gets a massive traffic spike or experiences a memory leak,
    #it can grow uncontrollably and consume 100% of your host server's RAM.
    #This will cause the entire operating system to freeze,
    #crashing your database and any other applications running on that machine.
    #With it: You set a strict cage around your app.
    #It can never use more than 2G of RAM or 2.0 CPU cores, protecting your underlying infrastructure.
    #
    #
    #
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G

    # ---- 2. INSERT APP HEALTHCHECK HERE ----

    # Without it: If your Spring Boot app experiences an OutOfMemoryError,
    # or loses its database connection permanently,
    # the container will look "Green/Running" to Docker,
    # but users will get 500 errors.With it: Docker pings your Spring Boot Actuator endpoint.
    # If the app fails to respond 3 times in a row, Docker flags it as unhealthy.
    # If you use orchestration tools (like Docker Swarm), it will automatically destroy the broken container and start a fresh one.
    #
    #
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s # Gives Spring Boot 60 seconds to boot up before checking

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - corebackend_pg_data:/var/lib/postgresql/data

volumes:
  corebackend_pg_data:
